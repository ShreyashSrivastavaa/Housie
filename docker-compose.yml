services:
  postgres:
    image: postgres:16-alpine
    container_name: housie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: housie_user
      POSTGRES_PASSWORD: housie_password
      POSTGRES_DB: housie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housie_user -d housie_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: housie_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
