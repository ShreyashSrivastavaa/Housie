name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: housie_user
          POSTGRES_PASSWORD: housie_password
          POSTGRES_DB: housie_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U housie_user -d housie_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://housie_user:housie_password@localhost:5432/housie_db?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: super-secret-ci-testing-jwt-secret-key-32chars
      NODE_ENV: test
      PORT: 4000
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations / generate
        run: pnpm --filter @housie/api prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Build
        run: pnpm build
